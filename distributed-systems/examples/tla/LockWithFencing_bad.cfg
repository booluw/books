\* LockWithFencing_bad.cfg: storage ignores fencing tokens.  Expected to FAIL.
\* TLC prints a trace in which client A checks its lease, pauses, its lease
\* expires, client B acquires the lock and writes, and then A's delayed
\* write lands on top of B's.
CONSTANTS
  Clients       = {c1, c2}
  Nobody        = Nobody
  LeaseDuration = 2
  MaxTime       = 6
  UseFencing    = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoStaleWrite
