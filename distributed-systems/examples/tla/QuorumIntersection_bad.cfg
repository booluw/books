\* QuorumIntersection_bad.cfg (config B): expected to FAIL.
\* N = 4, R = 2, W = 2, so R + W = 4 = N: two quorums can be disjoint.
\* TLC prints a three-state trace: a write to one pair of nodes, then a
\* read from the other pair, which shares no node with it (and so returns
\* the old version).
CONSTANTS
  N = 4
  R = 2
  W = 2
  MaxWrites = 3

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT QuorumsIntersect
INVARIANT ReadSeesLatestWrite
